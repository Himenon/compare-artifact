name: "Close Diff Artifact PR"
description: "Automatically close the corresponding PR in the diff viewer repository when the source PR is closed"

inputs:
  app-id:
    description: "GitHub App ID for authentication"
    required: true
  app-private-key:
    description: "GitHub App private key for authentication"
    required: true
  diff-viewer-owner:
    description: "Owner (organization or user) of the diff viewer repository"
    required: true
  diff-viewer-repo-name:
    description: "Name of the diff viewer repository"
    required: true
  prefix:
    description: "Prefix for the PR branch name in diff-viewer repository (e.g., 'diff-artifacts')"
    required: false
    default: "diff-artifacts"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Generate GitHub App Token
      id: generate-token
      uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.diff-viewer-owner }}
        repositories: ${{ inputs.diff-viewer-repo-name }}

    # Close PR in DIFF_VIEWER_REPO
    - name: Close PR in DIFF_VIEWER_REPO
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        DIFF_VIEWER_REPO: ${{ inputs.diff-viewer-owner }}/${{ inputs.diff-viewer-repo-name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BRANCH_PREFIX: ${{ inputs.prefix }}
      shell: bash
      run: |
        PR_BRANCH="${PR_BRANCH_PREFIX}-${PR_NUMBER}"

        echo "Searching for PR with head branch: $PR_BRANCH"

        # Search for PR from the target branch (regardless of state)
        EXISTING_PR=$(gh pr list --repo "$DIFF_VIEWER_REPO" --head "$PR_BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

        if [ -n "$EXISTING_PR" ]; then
          echo "Found open PR #$EXISTING_PR in $DIFF_VIEWER_REPO"
          echo "Closing PR #$EXISTING_PR..."

          # Close the PR
          gh pr close "$EXISTING_PR" --repo "$DIFF_VIEWER_REPO" --comment "Automatically closing because the source PR ${GITHUB_REPOSITORY}#${PR_NUMBER} was closed."

          echo "✅ Successfully closed PR #$EXISTING_PR"
        else
          echo "No open PR found for branch $PR_BRANCH in $DIFF_VIEWER_REPO"
          echo "This is expected if no diff PR was created or it was already closed."
        fi
